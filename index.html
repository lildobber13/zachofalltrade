function pixPaths(rows){
  const by = {};
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length){
      const ch = row[x];
      if (ch === '.'){ x++; continue; }
      let x2 = x; while (x2 < row.length && row[x2] === ch) x2++;
      (by[ch] = by[ch] || []).push('M'+x+' '+y+'h'+(x2 - x)+'v1h-'+(x2 - x)+'z');
      x = x2;
    }
  });

}

  wins.forEach(w => {
    const a = w === activeWin && !w.min;
    w.root.classList.toggle('inactive', !a);
    if (w.btn) w.btn.classList.toggle('active', a);
  });
}
function focusWin(w){
  if (w.min){ w.min = false; w.root.style.display = 'flex'; }
  w.root.style.zIndex = ++z; activeWin = w; refresh();
}
function focusTop(){
  const vis = [...wins].filter(w => !w.min).sort((a,b) => Number(b.root.style.zIndex) - Number(a.root.style.zIndex))[0];
  if (vis) focusWin(vis); else { activeWin = null; refresh(); }
}
function minWin(w){ w.min = true; w.root.style.display = 'none'; if (activeWin === w) focusTop(); else refresh(); }
function toggleMax(w){
  w.max = !w.max; w.root.classList.toggle('max', w.max);
  if (w.maxBtn){ w.maxBtn.innerHTML = glyph(w.max ? 'restore' : 'max'); w.maxBtn.title = w.max ? 'Restore' : 'Maximize'; }
}
function closeWin(w){
  if (w.opts.onClose) w.opts.onClose();
  w.root.remove(); if (w.btn) w.btn.remove(); wins.delete(w);
  if (w.opts.key) keyed.delete(w.opts.key);
  if (activeWin === w){ activeWin = null; focusTop(); } else refresh();
}
function drag(handle, e, onMove){
  const sx = e.clientX, sy = e.clientY;
  handle.setPointerCapture(e.pointerId);
  const mv = ev => onMove(ev.clientX - sx, ev.clientY - sy);
  const up = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up); };
  handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
}
function createWindow(o){
  if (o.key && keyed.has(o.key)){ const ex = keyed.get(o.key); focusWin(ex); return ex; }
  const resizable = o.resizable !== false, minimizable = o.minimizable !== false;
  const maximizable = o.maximizable !== undefined ? o.maximizable : resizable;
  const dw = innerWidth, dh = innerHeight - TB();
  const w = { min:false, max:false, opts:o };
  const root = h('div', { class:'win', style:'width:'+Math.min((o.w || 420) * S, dw - 4)+'px;'+(o.h ? 'height:'+Math.min(o.h * S, dh - 4)+'px;' : '') });
  const titleEl = h('span', { class:'t' }, o.title);
  const tb = h('div', { class:'titlebar' }, o.icon === null ? null : ico(o.icon || 'app', 16), titleEl);
  const mk = (g, title, fn) => h('button', { class:'tbtn', title, 'aria-label':title, html:glyph(g), on:{ click: e => { e.stopPropagation(); fn(); } } });
  if (minimizable) tb.append(mk('min', 'Minimize', () => minWin(w)));
  if (maximizable){ w.maxBtn = mk('max', 'Maximize', () => toggleMax(w)); tb.append(w.maxBtn); }
  tb.append(mk('close', 'Close', () => closeWin(w)));
  const body = h('div', { class:'body' }, o.content);
  root.append(tb); if (o.menu) root.append(o.menu); root.append(body);
  if (resizable){
    const g = h('div', { class:'grip' });
    g.addEventListener('pointerdown', e => {
      e.stopPropagation(); focusWin(w);
      const ow = root.offsetWidth, oh = root.offsetHeight;
      drag(g, e, (dx, dy) => { root.style.width = Math.max(240 * S, ow + dx)+'px'; root.style.height = Math.max(140 * S, oh + dy)+'px'; });
    });
    root.append(g);
  }
  root.addEventListener('pointerdown', () => focusWin(w), true);
  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('.tbtn') || w.max) return;
    const ox = root.offsetLeft, oy = root.offsetTop;
    drag(tb, e, (dx, dy) => {
      root.style.left = Math.max(60 * S - root.offsetWidth, Math.min(innerWidth - 60 * S, ox + dx))+'px';
      root.style.top = Math.max(0, Math.min(dh - 20 * S, oy + dy))+'px';
    });
  });
  if (maximizable) tb.addEventListener('dblclick', e => { if (!e.target.closest('.tbtn')) toggleMax(w); });
  desk.append(root);
  const baseX = (dw >= 900 ? 120 : 24) * S;
  let x = baseX + (cascade % 8) * 26 * S, y = (16 + (cascade % 8) * 26) * S; cascade++;
  if (o.center){ x = (dw - root.offsetWidth) / 2; y = (dh - root.offsetHeight) / 2.4; }
  if (x + root.offsetWidth > dw) x = Math.max(0, dw - root.offsetWidth);
  if (y + 40 * S > dh) y = 0;
  root.style.left = Math.max(0, x)+'px'; root.style.top = Math.max(0, y)+'px';
  w.root = root; w.titleEl = titleEl;
  w.setTitle = t => { titleEl.textContent = t; if (w.btnLabel) w.btnLabel.textContent = t; };
  if (o.taskbar !== false){
    w.btnLabel = h('span', { class:'tl' }, o.title);
    w.btn = h('button', { class:'task', on:{ click: () => { if (activeWin === w && !w.min) minWin(w); else focusWin(w); } } }, o.icon === null ? null : ico(o.icon || 'app', 16), w.btnLabel);
    tasks.append(w.btn);
  }
  wins.add(w); if (o.key) keyed.set(o.key, w);
  if (innerWidth < 720 && maximizable) toggleMax(w);
  focusWin(w);
  return w;
}

function closeMenus(){ document.querySelectorAll('.mi.open').forEach(x => x.classList.remove('open')); }
function menubar(defs){
  const bar = h('div', { class:'menubar' });
  defs.forEach(d => {
    const item = h('span', { class:'mi' }, d.label);
    const dd = h('div', { class:'dd' });
    d.items.forEach(it => {
      if (it === '-') dd.append(h('div', { class:'sep' }));
      else dd.append(h('div', { class:'ddi', on:{ click: () => { closeMenus(); if (it.run) it.run(); } } }, it.label));
    });
    item.append(dd);
    item.addEventListener('pointerdown', e => {
      if (e.target.closest('.dd')) return;
      e.stopPropagation();
      const was = item.classList.contains('open'); closeMenus(); if (!was) item.classList.add('open');
    });
    bar.append(item);
  });
  return bar;
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.mi')) closeMenus(); }, true);

function msgBox(o){
  let win;
  const row = h('div', { class:'brow' });
  (o.buttons || [{ label:'OK' }]).forEach(b => row.append(h('button', { class:'b', on:{ click: () => { closeWin(win); if (b.run) b.run(); } } }, b.label)));
  const content = h('div', { class:'msg' }, h('div', { class:'mrow' }, ico(o.icon || 'info', 32), h('div', { class:'mtxt', text:o.text })), row);
  win = createWindow({ title:o.title || CONFIG.siteName, icon:null, w:o.w || 320, content, center:true, resizable:false, minimizable:false, taskbar:false });
  const first = row.firstChild; if (first) first.focus();
  return win;
}

function balloon(title, text, url){
  const old = $('.balloon'); if (old) old.remove();
  const b = h('div', { class:'balloon' },
    h('b', { text:title }), h('br'), text,
    url ? [h('br'), h('a', { href:url, target:'_blank', rel:'noopener' }, 'Did not open? Click here.')] : null,
    h('span', { class:'x', on:{ click: () => b.remove() } }, '\u00D7'));
  document.body.append(b);
  setTimeout(() => b.remove(), 7000);
}

/* =====================================================================
   opening things
   ===================================================================== */
function openUrl(url, name){
  window.open(url, '_blank', 'noopener');
  balloon('Launching '+name, 'Opening in a new tab...', url);
}
function launchApp(a){ openUrl(a.url, a.name); }
function openNode(node, name, ctx){
  switch (node.type){
    case 'folder': openExplorer(ctx.tree, [...ctx.path, name]); break;
    case 'text': openNotepad(name, node.content); break;
    case 'pdf': openPdf(name, node); break;
    case 'link': case 'app': openUrl(node.url, node.label || name); break;
    case 'program': programs[node.run](); break;
    case 'dialog': msgBox({ title:name, text:node.msg, icon:'warn' }); break;
  }
}
function bindOpen(el, open, select){
  if (COARSE) el.addEventListener('click', open);
  else { el.addEventListener('click', select); el.addEventListener('dblclick', open); }
  el.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
}

function openNotepad(name, text){
  const ta = h('textarea', { class:'pad', spellcheck:'false' }); ta.value = text || '';
  let win;
  const mb = menubar([
    { label:'File', items:[ { label:'Exit', run: () => closeWin(win) } ] },
    { label:'Help', items:[ { label:'About Notepad', run: () => msgBox({ title:'About Notepad', icon:'info', text:'Notepad for ZachOS 95.\nIt does not save anything. Nothing here does.' }) } ] }
  ]);
  win = createWindow({ title:(name || 'Untitled')+' - Notepad', icon:'text', w:480, h:340, menu:mb, content:ta });
  return win;
}

function openPdf(name, node){
  const url = node.url, file = node.file || name;
  const save = () => { const a = h('a', { href:url, download:file }); document.body.append(a); a.click(); a.remove(); };
  const newTab = () => { window.open(url, '_blank', 'noopener'); };
  const touchy = COARSE || innerWidth < 720;
  const viewer = touchy
    ? h('div', { class:'pdfcard' }, ico('pdf', 64), h('div', { class:'mtxt', text:file }),
        h('div', { class:'brow' }, h('button', { class:'b', on:{ click:newTab } }, 'Open'), h('button', { class:'b', on:{ click:save } }, 'Save')))
    : h('iframe', { class:'pdfframe', src:url + '#view=FitH', title:name });
  let win;
  const mb = menubar([
    { label:'File', items:[ { label:'Save As...', run:save }, { label:'Open in New Tab', run:newTab }, '-', { label:'Close', run:() => closeWin(win) } ] },
    { label:'Help', items:[ { label:'About', run: () => msgBox({ title:'About', icon:'info', text:'Document Reader for ZachOS 95.' }) } ] }
  ]);
  const tool = h('div', { class:'tool' }, h('button', { class:'b', on:{ click:save } }, 'Save to my computer'), h('button', { class:'b', on:{ click:newTab } }, 'Open in new tab'));
  const content = h('div', { style:'display:flex;flex-direction:column;flex:1;min-height:0' }, tool, viewer);
  win = createWindow({ key:'pdf:' + name, title:name + ' - Reader', icon:'pdf', w:720, h:560, menu:mb, content });
  return win;
}

/* =====================================================================
   web browser (GitHub blocks iframes, so the profile is drawn from GitHub's public API)
   ===================================================================== */
function openBrowser(start){
  const HOME = 'about:home', GHUSER = CONFIG.githubUser, GH = 'https://github.com/' + GHUSER;
  let hist = [], pos = -1, win, cache = null;
  const addr = h('input', { class:'addr urlbox', type:'text', spellcheck:'false', autocapitalize:'off' });
  const page = h('div', { class:'webpage' });
  const stat = h('div', { class:'status', text:'Done' });
  const bBack = h('button', { class:'b', on:{ click: () => step(-1) } }, '← Back');
  const bFwd = h('button', { class:'b', on:{ click: () => step(1) } }, 'Forward →');
  const bRef = h('button', { class:'b', on:{ click: () => { cache = null; show(hist[pos]); } } }, 'Refresh');
  const bHome = h('button', { class:'b', on:{ click: () => nav(HOME) } }, 'Home');
  const link = (label, url) => h('button', { class:'b', on:{ click: () => nav(url) } }, label);

  const norm = v => {
    v = (v || '').trim();
    if (!v || /^(home|about:home)$/i.test(v)) return HOME;
    const m = v.match(/^(?:https?:\/\/)?(?:www\.)?github\.com\/([^\/?#]+)\/?$/i);
    if (m && m[1].toLowerCase() === GHUSER.toLowerCase()) return GH;
    if (/^https?:\/\//i.test(v) || /^[\w-]+(\.[\w-]+)+(\/|$)/.test(v)) return /^https?:\/\//i.test(v) ? v : 'https://' + v;
    return v;
  };
  const sync = () => { addr.value = hist[pos] || ''; bBack.disabled = pos <= 0; bFwd.disabled = pos >= hist.length - 1; };
  const titleFor = u => u === HOME ? 'Welcome' : u === GH ? GHUSER + ' (GitHub)' : 'Page cannot be displayed';
  function nav(v){
    const u = norm(v);
    hist = hist.slice(0, pos + 1); hist.push(u); pos = hist.length - 1; show(u);
  }
  function step(d){ const p = pos + d; if (p < 0 || p >= hist.length) return; pos = p; show(hist[pos]); }
  function show(u){
    sync(); page.scrollTop = 0; page.replaceChildren();
    win.setTitle && win.setTitle(titleFor(u) + ' - Web Browser');
    if (u === HOME) return home();
    if (u === GH) return profile();
    return fail(u);
  }
  function home(){
    stat.textContent = 'Done';
    page.append(h('div', { class:'wp home' },
      h('h1', { text:'Welcome to the Web' }),
      h('p', { text:'This is a tiny browser built into ZachOS 95. Most sites refuse to be shown inside other pages, so it can only render a few places.' }),
      h('h2', { text:'Links' }),
      h('ul', {},
        h('li', {}, h('a', { href:'#', on:{ click: e => { e.preventDefault(); nav(GH); } } }, 'My GitHub profile (' + GHUSER + ')')),
        ...CONFIG.apps.map(a => h('li', {}, h('a', { href:'#', on:{ click: e => { e.preventDefault(); launchApp(a); } } }, a.name), ' - opens in a new tab')))));
  }
  function fail(u){
    stat.textContent = 'Done';
    const real = /^https?:\/\//i.test(u);
    page.append(h('div', { class:'wp err' },
      h('h1', { text:'The page cannot be displayed' }),
      h('p', { text:'The page you are looking for is currently unavailable in this browser. Most websites do not allow themselves to be shown inside another page.' }),
      h('hr'),
      h('p', { text:'Please try the following:' }),
      h('ul', {}, h('li', { text:'Open the address in a real browser tab.' }), h('li', { text:'Go back to the home page or to my GitHub profile.' })),
      h('div', { class:'brow' },
        real ? h('button', { class:'b', on:{ click: () => openUrl(u, u) } }, 'Open in new tab') : null,
        h('button', { class:'b', on:{ click: () => nav(HOME) } }, 'Home'),
        h('button', { class:'b', on:{ click: () => nav(GH) } }, 'GitHub profile'))));
  }
  const ago = s => { const d = Math.round((Date.now() - new Date(s)) / 864e5); return d < 1 ? 'today' : d < 31 ? d + ' days ago' : d < 365 ? Math.round(d / 30) + ' months ago' : Math.round(d / 365) + ' years ago'; };
  const LANG = { JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572a5', HTML:'#e34c26', CSS:'#563d7c', Shell:'#89e051', Swift:'#f05138', Go:'#00add8', Rust:'#dea584', C:'#555555', 'C++':'#f34b7d', Java:'#b07219' };
  function profile(){
    stat.textContent = 'Connecting to github.com...';
    const out = h('div', { class:'wp gh' }, h('p', { text:'Loading ' + GH + ' ...' }));
    page.append(out);
    const get = cache ? Promise.resolve(cache) : Promise.all([
      fetch('https://api.github.com/users/' + GHUSER).then(r => { if (!r.ok) throw 0; return r.json(); }),
      fetch('https://api.github.com/users/' + GHUSER + '/repos?per_page=100&sort=updated').then(r => { if (!r.ok) throw 0; return r.json(); })
    ]);
    get.then(([u, repos]) => {
      cache = [u, repos];
      if (!page.contains(out)) return;
      repos = repos.filter(r => !r.fork).slice(0, 30);
      const stats = [u.followers + ' followers', u.following + ' following', u.public_repos + ' repositories'].join('  ·  ');
      out.replaceChildren(
        h('div', { class:'ghhead' },
          h('img', { class:'ghav', src:u.avatar_url + (u.avatar_url.indexOf('?') > -1 ? '&' : '?') + 's=200', alt:'' }),
          h('div', {},
            h('h1', { text:u.name || u.login }),
            h('div', { class:'ghlogin', text:u.login }),
            u.bio ? h('p', { text:u.bio }) : null,
            h('div', { class:'ghmeta', text:[u.location, u.company].filter(Boolean).join('  ·  ') }),
            h('div', { class:'ghmeta', text:stats }),
            h('div', { class:'brow' }, h('button', { class:'b', on:{ click: () => openUrl(GH, 'GitHub') } }, 'Open on GitHub')))),
        h('h2', { text:'Repositories' }),
        ...repos.map(r => h('div', { class:'ghrepo' },
          h('a', { href:r.html_url, target:'_blank', rel:'noopener', text:r.name }),
          h('div', { class:'ghdesc', text:r.description || '' }),
          h('div', { class:'ghmeta' },
            r.language ? h('span', {}, h('i', { class:'ghdot', style:'background:' + (LANG[r.language] || '#888') }), r.language + '   ') : null,
            r.stargazers_count ? '★ ' + r.stargazers_count + '   ' : '',
            'Updated ' + ago(r.pushed_at || r.updated_at)))));
      stat.textContent = 'Done';
    }).catch(() => {
      if (!page.contains(out)) return;
      out.replaceChildren(h('h1', { text:'Could not reach GitHub' }),
        h('p', { text:'GitHub did not answer (it may be rate limiting or you may be offline).' }),
        h('div', { class:'brow' }, h('button', { class:'b', on:{ click: () => openUrl(GH, 'GitHub') } }, 'Open on GitHub'), h('button', { class:'b', on:{ click: () => show(GH) } }, 'Try again')));
      stat.textContent = 'Done';
    });
  }

  addr.addEventListener('keydown', e => { if (e.key === 'Enter') nav(addr.value); e.stopPropagation(); });
  const mb = menubar([
    { label:'File', items:[ { label:'Open in New Tab', run: () => { const u = hist[pos]; if (/^https?:/.test(u)) openUrl(u, u); } }, '-', { label:'Close', run: () => closeWin(win) } ] },
    { label:'Go', items:[ { label:'Back', run: () => step(-1) }, { label:'Forward', run: () => step(1) }, { label:'Home Page', run: () => nav(HOME) } ] },
    { label:'Favorites', items:[ { label:GHUSER + ' on GitHub', run: () => nav(GH) } ] },
    { label:'Help', items:[ { label:'About', run: () => msgBox({ title:'About Web Browser', icon:'info', text:'Web Browser for ZachOS 95.\nIt only knows how to show a few pages.' }) } ] }
  ]);
  const content = h('div', { style:'display:flex;flex-direction:column;flex:1;min-height:0' },
    h('div', { class:'tool' }, bBack, bFwd, bRef, bHome),
    h('div', { class:'tool' }, h('span', { text:'Address' }), addr, h('button', { class:'b', on:{ click: () => nav(addr.value) } }, 'Go')),
    h('div', { class:'tool' }, h('span', { text:'Links' }), link('Home', HOME), link(GHUSER + ' on GitHub', GH)),
    h('div', { class:'sunken', style:'flex:1;min-height:0;display:flex;flex-direction:column' }, page),
    stat);
  win = createWindow({ key:'browser', title:'Welcome - Web Browser', icon:'globe', w:Math.min(780, Math.floor(innerWidth / window.__S) - 20), h:Math.min(580, Math.floor(innerHeight / window.__S) - 70), menu:mb, content });
  nav(start || HOME);
  return win;
}

function addrOf(tree, path){
  if (tree === 'bin') return 'Recycle Bin';
  if (!path.length) return 'My Computer';
  const parts = path.map((p, i) => i === 0 && p.indexOf('(C:)') > -1 ? 'C:' : p);
  return parts.join('\\') + (parts.length === 1 ? '\\' : '');
}
function openExplorer(tree, path, key){
  const st = { path: path.slice(), hist: [], sel: null };
  const list = h('div', { class:'list sunken' });
  const addr = h('div', { class:'addr sunken' });
  const status = h('div', { class:'status sunken' });
  const back = h('button', { class:'b', title:'Back', on:{ click: () => { if (st.hist.length){ st.path = st.hist.pop(); render(); } } } }, '\u2190 Back');
  const up = h('button', { class:'b', title:'Up one level', on:{ click: () => go(st.path.slice(0, -1)) } }, '\u2191 Up');
  let win;
  const mb = menubar([
    { label:'File', items:[ { label:'Close', run: () => closeWin(win) } ] },
    { label:'Go', items:[ { label:'My Computer', run: () => { if (tree === 'computer') go([]); } }, { label:'Applications', run: () => { if (tree === 'computer') go(['Zach (C:)', 'Applications']); } }, { label:'My Documents', run: () => { if (tree === 'computer') go(['Zach (C:)', 'My Documents']); } } ] },
    { label:'Help', items:[ { label:'About', run: () => msgBox({ title:'About', icon:'info', text:'Explorer for ZachOS 95.' }) } ] }
  ]);
  const content = h('div', { class:'body', style:'flex:1;display:flex;flex-direction:column;min-height:0' },
    h('div', { class:'tool' }, back, up, addr), list, status);
  win = createWindow({ key, title:'Explorer', icon:'folder', w:540, h:360, menu:mb, content });
  function go(p){ if (JSON.stringify(p) === JSON.stringify(st.path)) return; st.hist.push(st.path); st.path = p; render(); }
  function render(){
    const node = getNode(tree, st.path);
    const names = Object.keys(node.children);
    if (st.path.length || tree === 'bin'){
      names.sort((a, b) => {
        const fa = node.children[a].type === 'folder', fb = node.children[b].type === 'folder';
        return fa !== fb ? (fa ? -1 : 1) : a.localeCompare(b);
      });
    }
    list.textContent = ''; st.sel = null;
    names.forEach(name => {
      const n = node.children[name];
      const it = h('div', { class:'item', tabindex:'0', role:'button' }, ico(nodeIcon(n), 32), h('span', { class:'lbl', text:name }));
      bindOpen(it,
        () => { if (n.type === 'folder') go([...st.path, name]); else openNode(n, name, { tree, path: st.path }); },
        () => { if (st.sel) st.sel.classList.remove('sel'); st.sel = it; it.classList.add('sel'); });
      list.append(it);
    });
    addr.textContent = addrOf(tree, st.path);
    status.textContent = names.length+' object(s)';
    back.disabled = !st.hist.length; up.disabled = !st.path.length;
    const last = st.path.length ? st.path[st.path.length - 1] : (tree === 'bin' ? 'Recycle Bin' : 'My Computer');
    win.setTitle(last);
    const ic = win.root.querySelector('.titlebar .ic'); if (ic) ic.innerHTML = svg(st.path.length ? (st.path.length === 1 && tree === 'computer' ? 'drive' : 'folder') : (tree === 'bin' ? 'bin' : 'computer'), 16);
  }
  list.addEventListener('pointerdown', e => { if (e.target === list && st.sel){ st.sel.classList.remove('sel'); st.sel = null; } });
  render();
  return win;
}

/* =====================================================================
   MS-DOS prompt
   ===================================================================== */
function findChild(n, name){
  if (!n || n.type !== 'folder') return null;
  const lc = name.toLowerCase();
  for (const k in n.children) if (k.toLowerCase() === lc) return k;
  for (const k in n.children) if (k.toLowerCase().replace(/\.[^.]+$/, '') === lc) return k;
  return null;
}
function findApp(q){ q = q.toLowerCase(); return CONFIG.apps.find(a => a.id.toLowerCase() === q || a.name.toLowerCase() === q); }
function openDos(){
  const out = h('div', { class:'dos' });
  const cwd = ['Zach (C:)'];
  const prompt = () => 'C:\\' + cwd.slice(1).join('\\') + '>';
  const pr = h('span'), inp = h('input', { type:'text', autocomplete:'off', autocapitalize:'off', spellcheck:'false', 'aria-label':'Command' });
  const line = h('div', {}, pr, inp);
  const hist = []; let hi = 0;
  const print = t => { line.before(h('div', { text: t === '' ? '\u00A0' : t })); out.scrollTop = out.scrollHeight; };
  const lines = t => String(t).split('\n').forEach(print);
  const here = () => getNode('computer', cwd);

  };
  cmds.ls = cmds.dir; cmds.chdir = cmds.cd; cmds.cat = cmds.type; cmds.more = cmds.type; cmds.open = cmds.start; cmds.run = cmds.start; cmds.clear = cmds.cls; cmds.rm = cmds.del; cmds.quit = cmds.exit;

   ===================================================================== */
function openMinesweeper(){
  if (keyed.has('mines')){ focusWin(keyed.get('mines')); return; }
  const W = 9, H = 9, M = 10;
  let mine, adj, rev, flag, over, won, first, time, timer, flags;
  const mineCnt = h('div', { class:'led sunken' }), timeCnt = h('div', { class:'led sunken' });
  const face = h('button', { class:'face', title:'New game', on:{ click: reset } }, ':)');
  const grid = h('div', { class:'mgrid sunken' }); grid.style.gridTemplateColumns = 'repeat('+W+',1.25rem)';
  const cells = [];
  const led = n => String(Math.max(-99, Math.min(999, n))).padStart(3, '0');
  const nb = i => { const x = i % W, y = (i / W) | 0, r = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){ if (!dx && !dy) continue; const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < W && ny < H) r.push(ny * W + nx); } return r; };
  for (let i = 0; i < W * H; i++){ const c = h('button', { class:'cell', 'data-i':i, 'aria-label':'cell' }); cells.push(c); grid.append(c); }
  function paint(){
    cells.forEach((c, i) => {
      let cls = 'cell', t = '';
      if (rev[i]){ cls += ' r'; if (mine[i]){ t = '\u25CF'; if (over && !won && c.dataset.hit === '1') cls += ' boom'; } else if (adj[i]){ t = adj[i]; cls += ' n'+adj[i]; } }
      else if (flag[i]){ t = (over && !won && !mine[i]) ? '\u2717' : '\u2691'; cls += ' f'; }
      c.className = cls; c.textContent = t;
    });
    mineCnt.textContent = led(M - flags); timeCnt.textContent = led(time);
  }
  function reset(){
    clearInterval(timer); timer = null;
    mine = Array(W * H).fill(false); adj = Array(W * H).fill(0); rev = Array(W * H).fill(false); flag = Array(W * H).fill(false);
    over = false; won = false; first = true; time = 0; flags = 0; face.textContent = ':)';
    cells.forEach(c => { delete c.dataset.hit; }); paint();
  }
  function place(safe){
    const ban = new Set([safe, ...nb(safe)]); let n = 0;
    while (n < M){ const i = (Math.random() * W * H) | 0; if (!mine[i] && !ban.has(i)){ mine[i] = true; n++; } }
    for (let i = 0; i < W * H; i++) adj[i] = nb(i).filter(j => mine[j]).length;
  }
  function reveal(i){
    if (over || flag[i] || rev[i]) return;
    if (first){ place(i); first = false; timer = setInterval(() => { time++; timeCnt.textContent = led(time); }, 1000); }
    if (mine[i]){
      over = true; clearInterval(timer); cells[i].dataset.hit = '1';
      mine.forEach((m, j) => { if (m) rev[j] = true; }); face.textContent = 'X('; paint(); return;
    }
    const st = [i];
    while (st.length){ const j = st.pop(); if (rev[j] || flag[j]) continue; rev[j] = true; if (!adj[j]) nb(j).forEach(k => { if (!rev[k]) st.push(k); }); }
    if (rev.filter(Boolean).length === W * H - M){
      over = won = true; clearInterval(timer); face.textContent = 'B)';
      mine.forEach((m, j) => { if (m) flag[j] = true; }); flags = M;
    }
    paint();
  }
  function toggleFlag(i){ if (over || rev[i]) return; flag[i] = !flag[i]; flags += flag[i] ? 1 : -1; paint(); }
  let lp = null, lpFired = false;
  grid.addEventListener('pointerdown', e => {
    const c = e.target.closest('.cell'); if (!c) return;
    lpFired = false; if (!over) face.textContent = ':O';
    if (e.pointerType === 'touch') lp = setTimeout(() => { lpFired = true; toggleFlag(+c.dataset.i); if (navigator.vibrate) navigator.vibrate(20); }, 400);
  });
  const rel = () => { clearTimeout(lp); if (!over) face.textContent = ':)'; };
  grid.addEventListener('pointerup', rel); grid.addEventListener('pointerleave', rel);
  grid.addEventListener('click', e => { const c = e.target.closest('.cell'); if (!c) return; if (lpFired){ lpFired = false; return; } reveal(+c.dataset.i); });
  grid.addEventListener('contextmenu', e => { e.preventDefault(); const c = e.target.closest('.cell'); if (c) toggleFlag(+c.dataset.i); });
  const content = h('div', { class:'mine' }, h('div', { class:'mtop sunken' }, mineCnt, face, timeCnt), grid);
  const mb = menubar([
    { label:'Game', items:[ { label:'New', run: reset }, '-', { label:'Exit', run: () => closeWin(win) } ] },
    { label:'Help', items:[ { label:'How to play', run: () => msgBox({ title:'Minesweeper', icon:'info', text:'Click to reveal a square.\nRight-click (or long-press on touch) to flag a mine.\nNumbers show how many mines touch a square.' }) } ] }
  ]);
  const win = createWindow({ key:'mines', title:'Minesweeper', icon:'mine', w:226, menu:mb, content, resizable:false, onClose: () => clearInterval(timer) });
  reset();
}

function fitSub(li){
  const ul = li.querySelector(':scope>.sm'); if (!ul || innerWidth <= 640) return;
  ul.style.top = ''; ul.style.maxHeight = ''; ul.style.overflowY = ''; ul.classList.remove('left');
  let r = ul.getBoundingClientRect();
  if (r.right > innerWidth){ ul.classList.add('left'); r = ul.getBoundingClientRect(); }
  const limit = innerHeight - TB() - 2, base = parseFloat(getComputedStyle(ul).top);
  if (r.bottom > limit) ul.style.top = (base - (r.bottom - limit)) + 'px';
  r = ul.getBoundingClientRect();
  if (r.top < 2){
    ul.style.top = (base - r.top + 2 + (parseFloat(ul.style.top || base) - base)) + 'px';
    r = ul.getBoundingClientRect();
    if (r.bottom > limit && !ul.querySelector('li.arrow')){ ul.style.maxHeight = Math.max(80, limit - r.top) + 'px'; ul.style.overflowY = 'auto'; }
  }
}

function closeStart(){ startMenu.classList.remove('show'); startBtn.classList.remove('on'); startMenu.querySelectorAll('li.open').forEach(l => l.classList.remove('open')); }
startBtn.addEventListener('click', e => { e.stopPropagation(); const s = startMenu.classList.toggle('show'); startBtn.classList.toggle('on', s); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#startmenu') && !e.target.closest('#start')) closeStart(); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeStart(); closeCtx(); closeMenus(); } });

let ctxEl = null;
function closeCtx(){ if (ctxEl){ ctxEl.remove(); ctxEl = null; } }
desk.addEventListener('contextmenu', e => {
  if (e.target.closest('.win')) return;
  e.preventDefault(); closeCtx();
  const mk = (label, fn) => h('div', { class:'ddi', on:{ click: () => { closeCtx(); fn(); } } }, label);
  ctxEl = h('div', { class:'ctx' },
    mk('Refresh', () => { iconsEl.style.visibility = 'hidden'; setTimeout(() => { iconsEl.style.visibility = ''; }, 120); }),
    mk('Screen Saver', startSaver),
    mk('Display Settings', openDisplay),
    h('div', { class:'sep' }),
    mk('Properties', openSystem));
  document.body.append(ctxEl);
  ctxEl.style.left = Math.min(e.clientX, innerWidth - ctxEl.offsetWidth - 2)+'px';
  ctxEl.style.top = Math.min(e.clientY, innerHeight - ctxEl.offsetHeight - TB() - 2)+'px';
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.ctx')) closeCtx(); }, true);

const clock = $('#clock');
const tick = () => { clock.textContent = new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); };
tick(); setInterval(tick, 10000);
$('#tray').addEventListener('dblclick', () => msgBox({ title:'Date/Time Properties', icon:'info', text:new Date().toLocaleString([], { dateStyle:'full', timeStyle:'short' }) }));

/* =====================================================================
   easter eggs: konami code, cheat words, blue screen, screen saver
   ===================================================================== */
const KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
let buf = [];
document.addEventListener('keydown', e => {
  if (e.key.length > 1 && e.key.indexOf('Arrow') !== 0) return;
  const typing = /^(input|textarea)$/i.test(e.target.tagName);
  buf.push(e.key.toLowerCase()); buf = buf.slice(-10);
  if (buf.join() === KONAMI.join()){ buf = []; showBsod(); return; }
  if (!typing){
    const s = buf.filter(k => k.length === 1).join('');
    if (/idkfa$/.test(s)){ buf = []; msgBox({ title:'DOOM', icon:'info', text:'Cheat activated: full health, all keys, and an alarming number of browser tabs.' }); }
    else if (/xyzzy$/.test(s)){ buf = []; msgBox({ title:CONFIG.siteName, icon:'info', text:'Nothing happens.' }); }
  }
});
function showBsod(){
  if ($('#bsod')) return;
  const b = h('div', { id:'bsod' }, h('div', { style:'text-align:center;margin-bottom:1.5rem' }, h('b', { text:' ZachOS 95 ' })),
`A fatal exception 0E has occurred at 0028:C0011E36 in VXD VMM(01) + 00010E36. The current application will be terminated.

Cause: Konami code detected. Honestly, this one is not your fault.

*  Press any key to terminate the current application.
*  Press CTRL+ALT+DEL again to restart your computer. You will lose any unsaved information in all applications.

                       Press any key to continue _`);
  document.body.append(b);
  const kill = () => { b.remove(); document.removeEventListener('keydown', kill, true); };
  setTimeout(() => { document.addEventListener('keydown', kill, true); b.addEventListener('pointerdown', kill); }, 400);
}
let idleT, saverOn = false;
function resetIdle(){ clearTimeout(idleT); if (!saverOn) idleT = setTimeout(startSaver, 120000); }
function startSaver(){
  if (saverOn) return; saverOn = true; closeStart(); closeCtx();
  const c = h('canvas', { id:'saver' }); document.body.append(c);
  c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d');
  const stars = Array.from({ length:220 }, () => ({ x:(Math.random() - .5) * 2, y:(Math.random() - .5) * 2, z:Math.random() }));
  let raf;
  const frame = () => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#fff';
    for (const s of stars){
      s.z -= 0.006;
      if (s.z <= 0.02){ s.x = (Math.random() - .5) * 2; s.y = (Math.random() - .5) * 2; s.z = 1; }
      const px = c.width / 2 + s.x / s.z * c.width / 4, py = c.height / 2 + s.y / s.z * c.height / 4, r = Math.max(1, (1 - s.z) * 3);
      ctx.fillRect(px, py, r, r);
    }
    raf = requestAnimationFrame(frame);
  };
  frame();
  let armed = false; setTimeout(() => { armed = true; }, 500);
  const stop = () => { cancelAnimationFrame(raf); c.remove(); saverOn = false; window.removeEventListener('keydown', stop, true); window.removeEventListener('pointerdown', stop, true); window.removeEventListener('pointermove', mv, true); resetIdle(); };
  const mv = () => { if (armed) stop(); };
  window.addEventListener('keydown', stop, true); window.addEventListener('pointerdown', stop, true); window.addEventListener('pointermove', mv, true);
}
['pointermove', 'pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle, true));
resetIdle();

/* =====================================================================
   boot sequence
   ===================================================================== */
function boot(){
  const b = $('#boot');
  let seen = false; try { seen = !!sessionStorage.getItem('zoat_booted'); } catch (e) {}
  if (seen || /noboot/.test(location.search)){ b.remove(); return Promise.resolve(); }
  return new Promise(resolve => {
    b.style.display = 'block';
    const lines = [
      'ZachOS BIOS v1.0, An Over-Caffeinated Production',
      'Copyright (C) 1986-2026 Zach of All Trades, Inc.', '',
      'CPU: Pentium-ish 100 MHz',
      'Memory Test: 640K OK',
      'Detecting Primary Master ... Hard Drive of Many Hats',
      'Detecting Secondary Master ... CD-ROM', '',
      'Press any key to skip...', '',
      'Starting ZachOS 95...'
    ];
    let done = false; const timers = [];
    const finish = () => {
      if (done) return; done = true; timers.forEach(clearTimeout);
      try { sessionStorage.setItem('zoat_booted', '1'); } catch (e) {}
      document.removeEventListener('keydown', finish); b.remove(); resolve();
    };
    lines.forEach((l, i) => timers.push(setTimeout(() => { b.append(l + '\n'); }, 160 + i * 130)));
    timers.push(setTimeout(() => {
      b.textContent = '';
      b.append(h('div', { class:'splash' }, h('h1', { text:'ZachOS 95' }), h('p', { text:'Starting up...' }), h('div', { class:'pbar' }, h('i'))));
    }, 160 + lines.length * 130 + 300));
    timers.push(setTimeout(finish, 160 + lines.length * 130 + 2300));
    b.addEventListener('pointerdown', finish); document.addEventListener('keydown', finish);
  });
}
boot().then(() => {
  let hide = false; try { hide = !!localStorage.getItem('zoat_notips'); } catch (e) {}
  if (!hide) setTimeout(openTips, 350);
});
})();
