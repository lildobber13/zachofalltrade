/* =====================================================================
   window manager
   ===================================================================== */
const desk = $('#desktop'), tasks = $('#tasks');
let z = 100, cascade = 0, activeWin = null;
const wins = new Set(), keyed = new Map();

function refresh(){
  wins.forEach(w => {
    const a = w === activeWin && !w.min;
    w.root.classList.toggle('inactive', !a);
    if (w.btn) w.btn.classList.toggle('active', a);
  });
}
function focusWin(w){
  if (w.min){ w.min = false; w.root.style.display = 'flex'; }
  w.root.style.zIndex = ++z; activeWin = w; refresh();
}
function focusTop(){
  const vis = [...wins].filter(w => !w.min).sort((a,b) => Number(b.root.style.zIndex) - Number(a.root.style.zIndex))[0];
  if (vis) focusWin(vis); else { activeWin = null; refresh(); }
}
function minWin(w){ w.min = true; w.root.style.display = 'none'; if (activeWin === w) focusTop(); else refresh(); }
function toggleMax(w){
  w.max = !w.max; w.root.classList.toggle('max', w.max);
  if (w.maxBtn) w.maxBtn.textContent = w.max ? '\u2750' : '\u25A1';
}
function closeWin(w){
  if (w.opts.onClose) w.opts.onClose();
  w.root.remove(); if (w.btn) w.btn.remove(); wins.delete(w);
  if (w.opts.key) keyed.delete(w.opts.key);
  if (activeWin === w){ activeWin = null; focusTop(); } else refresh();
}
function drag(handle, e, onMove){
  const sx = e.clientX, sy = e.clientY;
  handle.setPointerCapture(e.pointerId);
  const mv = ev => onMove(ev.clientX - sx, ev.clientY - sy);
  const up = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up); };
  handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
}
function createWindow(o){
  if (o.key && keyed.has(o.key)){ const ex = keyed.get(o.key); focusWin(ex); return ex; }
  const resizable = o.resizable !== false, minimizable = o.minimizable !== false;
  const maximizable = o.maximizable !== undefined ? o.maximizable : resizable;
  const dw = innerWidth, dh = innerHeight - TB();
  const w = { min:false, max:false, opts:o };
  const root = h('div', { class:'win', style:'width:'+Math.min((o.w || 420) * S, dw - 4)+'px;'+(o.h ? 'height:'+Math.min(o.h * S, dh - 4)+'px;' : '') });
  const titleEl = h('span', { class:'t' }, o.title);
  const tb = h('div', { class:'titlebar' }, o.icon === null ? null : ico(o.icon || 'app', 16), titleEl);
  const mk = (txt, title, fn) => h('button', { class:'tbtn', title, 'aria-label':title, on:{ click: e => { e.stopPropagation(); fn(); } } }, txt);
  if (minimizable) tb.append(mk('_', 'Minimize', () => minWin(w)));
  if (maximizable){ w.maxBtn = mk('\u25A1', 'Maximize', () => toggleMax(w)); tb.append(w.maxBtn); }
  tb.append(mk('\u00D7', 'Close', () => closeWin(w)));
  const body = h('div', { class:'body' }, o.content);
  root.append(tb); if (o.menu) root.append(o.menu); root.append(body);
  if (resizable){
    const g = h('div', { class:'grip' });
    g.addEventListener('pointerdown', e => {
      e.stopPropagation(); focusWin(w);
      const ow = root.offsetWidth, oh = root.offsetHeight;
      drag(g, e, (dx, dy) => { root.style.width = Math.max(240 * S, ow + dx)+'px'; root.style.height = Math.max(140 * S, oh + dy)+'px'; });
    });
    root.append(g);
  }
  root.addEventListener('pointerdown', () => focusWin(w), true);
  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('.tbtn') || w.max) return;
    const ox = root.offsetLeft, oy = root.offsetTop;
    drag(tb, e, (dx, dy) => {
      root.style.left = Math.max(60 * S - root.offsetWidth, Math.min(innerWidth - 60 * S, ox + dx))+'px';
      root.style.top = Math.max(0, Math.min(dh - 20 * S, oy + dy))+'px';
    });
  });
  if (maximizable) tb.addEventListener('dblclick', e => { if (!e.target.closest('.tbtn')) toggleMax(w); });
  desk.append(root);
  const baseX = (dw >= 900 ? 120 : 24) * S;
  let x = baseX + (cascade % 8) * 26 * S, y = (16 + (cascade % 8) * 26) * S; cascade++;
  if (o.center){ x = (dw - root.offsetWidth) / 2; y = (dh - root.offsetHeight) / 2.4; }
  if (x + root.offsetWidth > dw) x = Math.max(0, dw - root.offsetWidth);
  if (y + 40 * S > dh) y = 0;
  root.style.left = Math.max(0, x)+'px'; root.style.top = Math.max(0, y)+'px';
  w.root = root; w.titleEl = titleEl;
  w.setTitle = t => { titleEl.textContent = t; if (w.btnLabel) w.btnLabel.textContent = t; };
  if (o.taskbar !== false){
    w.btnLabel = h('span', { class:'tl' }, o.title);
    w.btn = h('button', { class:'task', on:{ click: () => { if (activeWin === w && !w.min) minWin(w); else focusWin(w); } } }, o.icon === null ? null : ico(o.icon || 'app', 16), w.btnLabel);
    tasks.append(w.btn);
  }
  wins.add(w); if (o.key) keyed.set(o.key, w);
  if (innerWidth < 720 && maximizable) toggleMax(w);
  focusWin(w);
  return w;
}

function closeMenus(){ document.querySelectorAll('.mi.open').forEach(x => x.classList.remove('open')); }

function openNode(node, name, ctx){

    case 'text': openNotepad(name, node.content); break;
    case 'pdf': openPdf(name, node); break;

function addrOf(tree, path){
  if (tree === 'bin') return 'Recycle Bin';
  if (!path.length) return 'My Computer';
  const parts = path.map((p, i) => i === 0 && p.indexOf('(C:)') > -1 ? 'C:' : p);
  return parts.join('\\') + (parts.length === 1 ? '\\' : '');
}
function openExplorer(tree, path, key){
  const st = { path: path.slice(), hist: [], sel: null };
  const list = h('div', { class:'list sunken' });
  const addr = h('div', { class:'addr sunken' });
  const status = h('div', { class:'status sunken' });
  const back = h('button', { class:'b', title:'Back', on:{ click: () => { if (st.hist.length){ st.path = st.hist.pop(); render(); } } } }, '\u2190 Back');
  const up = h('button', { class:'b', title:'Up one level', on:{ click: () => go(st.path.slice(0, -1)) } }, '\u2191 Up');
  let win;
  const mb = menubar([
    { label:'File', items:[ { label:'Close', run: () => closeWin(win) } ] },
    { label:'Go', items:[ { label:'My Computer', run: () => { if (tree === 'computer') go([]); } }, { label:'Applications', run: () => { if (tree === 'computer') go(['Zach (C:)', 'Applications']); } }, { label:'My Documents', run: () => { if (tree === 'computer') go(['Zach (C:)', 'My Documents']); } } ] },
    { label:'Help', items:[ { label:'About', run: () => msgBox({ title:'About', icon:'info', text:'Explorer for ZachOS 95.' }) } ] }
  ]);
  const content = h('div', { class:'body', style:'flex:1;display:flex;flex-direction:column;min-height:0' },
    h('div', { class:'tool' }, back, up, addr), list, status);
  win = createWindow({ key, title:'Explorer', icon:'folder', w:540, h:360, menu:mb, content });
  function go(p){ if (JSON.stringify(p) === JSON.stringify(st.path)) return; st.hist.push(st.path); st.path = p; render(); }
  function render(){
    const node = getNode(tree, st.path);
    const names = Object.keys(node.children);
    if (st.path.length || tree === 'bin'){
      names.sort((a, b) => {
        const fa = node.children[a].type === 'folder', fb = node.children[b].type === 'folder';
        return fa !== fb ? (fa ? -1 : 1) : a.localeCompare(b);
      });
    }
    list.textContent = ''; st.sel = null;
    names.forEach(name => {
      const n = node.children[name];
      const it = h('div', { class:'item', tabindex:'0', role:'button' }, ico(nodeIcon(n), 32), h('span', { class:'lbl', text:name }));
      bindOpen(it,
        () => { if (n.type === 'folder') go([...st.path, name]); else openNode(n, name, { tree, path: st.path }); },
        () => { if (st.sel) st.sel.classList.remove('sel'); st.sel = it; it.classList.add('sel'); });
      list.append(it);
    });
    addr.textContent = addrOf(tree, st.path);
    status.textContent = names.length+' object(s)';
    back.disabled = !st.hist.length; up.disabled = !st.path.length;
    const last = st.path.length ? st.path[st.path.length - 1] : (tree === 'bin' ? 'Recycle Bin' : 'My Computer');
    win.setTitle(last);
    const ic = win.root.querySelector('.titlebar .ic'); if (ic) ic.innerHTML = svg(st.path.length ? (st.path.length === 1 && tree === 'computer' ? 'drive' : 'folder') : (tree === 'bin' ? 'bin' : 'computer'), 16);
  }
  list.addEventListener('pointerdown', e => { if (e.target === list && st.sel){ st.sel.classList.remove('sel'); st.sel = null; } });
  render();
  return win;
}

   ===================================================================== */
function openMinesweeper(){
  if (keyed.has('mines')){ focusWin(keyed.get('mines')); return; }
  const W = 9, H = 9, M = 10;
  let mine, adj, rev, flag, over, won, first, time, timer, flags;
  const mineCnt = h('div', { class:'led sunken' }), timeCnt = h('div', { class:'led sunken' });
  const face = h('button', { class:'face', title:'New game', on:{ click: reset } }, ':)');
  const grid = h('div', { class:'mgrid sunken' }); grid.style.gridTemplateColumns = 'repeat('+W+',1.25rem)';
  const cells = [];
  const led = n => String(Math.max(-99, Math.min(999, n))).padStart(3, '0');
  const nb = i => { const x = i % W, y = (i / W) | 0, r = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){ if (!dx && !dy) continue; const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < W && ny < H) r.push(ny * W + nx); } return r; };
  for (let i = 0; i < W * H; i++){ const c = h('button', { class:'cell', 'data-i':i, 'aria-label':'cell' }); cells.push(c); grid.append(c); }
  function paint(){
    cells.forEach((c, i) => {
      let cls = 'cell', t = '';
      if (rev[i]){ cls += ' r'; if (mine[i]){ t = '\u25CF'; if (over && !won && c.dataset.hit === '1') cls += ' boom'; } else if (adj[i]){ t = adj[i]; cls += ' n'+adj[i]; } }
      else if (flag[i]){ t = (over && !won && !mine[i]) ? '\u2717' : '\u2691'; cls += ' f'; }
      c.className = cls; c.textContent = t;
    });
    mineCnt.textContent = led(M - flags); timeCnt.textContent = led(time);
  }
  function reset(){
    clearInterval(timer); timer = null;
    mine = Array(W * H).fill(false); adj = Array(W * H).fill(0); rev = Array(W * H).fill(false); flag = Array(W * H).fill(false);
    over = false; won = false; first = true; time = 0; flags = 0; face.textContent = ':)';
    cells.forEach(c => { delete c.dataset.hit; }); paint();
  }
  function place(safe){
    const ban = new Set([safe, ...nb(safe)]); let n = 0;
    while (n < M){ const i = (Math.random() * W * H) | 0; if (!mine[i] && !ban.has(i)){ mine[i] = true; n++; } }
    for (let i = 0; i < W * H; i++) adj[i] = nb(i).filter(j => mine[j]).length;
  }
  function reveal(i){
    if (over || flag[i] || rev[i]) return;
    if (first){ place(i); first = false; timer = setInterval(() => { time++; timeCnt.textContent = led(time); }, 1000); }
    if (mine[i]){
      over = true; clearInterval(timer); cells[i].dataset.hit = '1';
      mine.forEach((m, j) => { if (m) rev[j] = true; }); face.textContent = 'X('; paint(); return;
    }
    const st = [i];
    while (st.length){ const j = st.pop(); if (rev[j] || flag[j]) continue; rev[j] = true; if (!adj[j]) nb(j).forEach(k => { if (!rev[k]) st.push(k); }); }
    if (rev.filter(Boolean).length === W * H - M){
      over = won = true; clearInterval(timer); face.textContent = 'B)';
      mine.forEach((m, j) => { if (m) flag[j] = true; }); flags = M;
    }
    paint();
  }
  function toggleFlag(i){ if (over || rev[i]) return; flag[i] = !flag[i]; flags += flag[i] ? 1 : -1; paint(); }
  let lp = null, lpFired = false;
  grid.addEventListener('pointerdown', e => {
    const c = e.target.closest('.cell'); if (!c) return;
    lpFired = false; if (!over) face.textContent = ':O';
    if (e.pointerType === 'touch') lp = setTimeout(() => { lpFired = true; toggleFlag(+c.dataset.i); if (navigator.vibrate) navigator.vibrate(20); }, 400);
  });
  const rel = () => { clearTimeout(lp); if (!over) face.textContent = ':)'; };
  grid.addEventListener('pointerup', rel); grid.addEventListener('pointerleave', rel);
  grid.addEventListener('click', e => { const c = e.target.closest('.cell'); if (!c) return; if (lpFired){ lpFired = false; return; } reveal(+c.dataset.i); });
  grid.addEventListener('contextmenu', e => { e.preventDefault(); const c = e.target.closest('.cell'); if (c) toggleFlag(+c.dataset.i); });
  const content = h('div', { class:'mine' }, h('div', { class:'mtop sunken' }, mineCnt, face, timeCnt), grid);
  const mb = menubar([
    { label:'Game', items:[ { label:'New', run: reset }, '-', { label:'Exit', run: () => closeWin(win) } ] },
    { label:'Help', items:[ { label:'How to play', run: () => msgBox({ title:'Minesweeper', icon:'info', text:'Click to reveal a square.\nRight-click (or long-press on touch) to flag a mine.\nNumbers show how many mines touch a square.' }) } ] }
  ]);
  const win = createWindow({ key:'mines', title:'Minesweeper', icon:'mine', w:226, menu:mb, content, resizable:false, onClose: () => clearInterval(timer) });
  reset();
}

    else if (/xyzzy$/.test(s)){ buf = []; msgBox({ title:CONFIG.siteName, icon:'info', text:'Nothing happens.' }); }
  }
});
function showBsod(){
  if ($('#bsod')) return;
  const b = h('div', { id:'bsod' }, h('div', { style:'text-align:center;margin-bottom:1.5rem' }, h('b', { text:' ZachOS 95 ' })),
`A fatal exception 0E has occurred at 0028:C0011E36 in VXD VMM(01) + 00010E36. The current application will be terminated.

Cause: Konami code detected. Honestly, this one is not your fault.

*  Press any key to terminate the current application.
*  Press CTRL+ALT+DEL again to restart your computer. You will lose any unsaved information in all applications.

                       Press any key to continue _`);
  document.body.append(b);
  const kill = () => { b.remove(); document.removeEventListener('keydown', kill, true); };
  setTimeout(() => { document.addEventListener('keydown', kill, true); b.addEventListener('pointerdown', kill); }, 400);
}
let idleT, saverOn = false;
function resetIdle(){ clearTimeout(idleT); if (!saverOn) idleT = setTimeout(startSaver, 120000); }
function startSaver(){
  if (saverOn) return; saverOn = true; closeStart(); closeCtx();
  const c = h('canvas', { id:'saver' }); document.body.append(c);
  c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d');
  const stars = Array.from({ length:220 }, () => ({ x:(Math.random() - .5) * 2, y:(Math.random() - .5) * 2, z:Math.random() }));
  let raf;
  const frame = () => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#fff';
    for (const s of stars){
      s.z -= 0.006;
      if (s.z <= 0.02){ s.x = (Math.random() - .5) * 2; s.y = (Math.random() - .5) * 2; s.z = 1; }
      const px = c.width / 2 + s.x / s.z * c.width / 4, py = c.height / 2 + s.y / s.z * c.height / 4, r = Math.max(1, (1 - s.z) * 3);
      ctx.fillRect(px, py, r, r);
    }
    raf = requestAnimationFrame(frame);
  };
  frame();
  let armed = false; setTimeout(() => { armed = true; }, 500);
  const stop = () => { cancelAnimationFrame(raf); c.remove(); saverOn = false; window.removeEventListener('keydown', stop, true); window.removeEventListener('pointerdown', stop, true); window.removeEventListener('pointermove', mv, true); resetIdle(); };
  const mv = () => { if (armed) stop(); };
  window.addEventListener('keydown', stop, true); window.addEventListener('pointerdown', stop, true); window.addEventListener('pointermove', mv, true);
}
['pointermove', 'pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle, true));
resetIdle();

/* =====================================================================
   boot sequence
   ===================================================================== */
function boot(){
  const b = $('#boot');
  let seen = false; try { seen = !!sessionStorage.getItem('zoat_booted'); } catch (e) {}
  if (seen || /noboot/.test(location.search)){ b.remove(); return Promise.resolve(); }
  return new Promise(resolve => {
    b.style.display = 'block';
    const lines = [
      'ZachOS BIOS v1.0, An Over-Caffeinated Production',
      'Copyright (C) 1986-2026 Zach of All Trades, Inc.', '',
      'CPU: Pentium-ish 100 MHz',
      'Memory Test: 640K OK',
      'Detecting Primary Master ... Hard Drive of Many Hats',
      'Detecting Secondary Master ... CD-ROM', '',
      'Press any key to skip...', '',
      'Starting ZachOS 95...'
    ];
    let done = false; const timers = [];
    const finish = () => {
      if (done) return; done = true; timers.forEach(clearTimeout);
      try { sessionStorage.setItem('zoat_booted', '1'); } catch (e) {}
      document.removeEventListener('keydown', finish); b.remove(); resolve();
    };
    lines.forEach((l, i) => timers.push(setTimeout(() => { b.append(l + '\n'); }, 160 + i * 130)));
    timers.push(setTimeout(() => {
      b.textContent = '';
      b.append(h('div', { class:'splash' }, h('h1', { text:'ZachOS 95' }), h('p', { text:'Starting up...' }), h('div', { class:'pbar' }, h('i'))));
    }, 160 + lines.length * 130 + 300));
    timers.push(setTimeout(finish, 160 + lines.length * 130 + 2300));
    b.addEventListener('pointerdown', finish); document.addEventListener('keydown', finish);
  });
}
boot().then(() => {
  let hide = false; try { hide = !!localStorage.getItem('zoat_notips'); } catch (e) {}
  if (!hide) setTimeout(openTips, 350);
});
})();
