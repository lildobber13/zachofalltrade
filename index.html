    }
  });

}

const svgCache = {};
function svg(name, px){
  if (IMGICON[name]){ const z = Math.round(px * S); return '<img src="'+(px <= 20 ? IMGICON[name].small : IMGICON[name].big)+'" width="'+z+'" height="'+z+'" alt="" draggable="false" style="display:block">'; }
  const small = px <= 20 && PIX16[name];
  const rows = small ? PIX16[name] : (PIX32[name] || PIX32.app);
  const n = rows.length, sz = Math.round(px * S), key = name + '|' + (small ? 16 : 32);
  if (!svgCache[key]) svgCache[key] = pixPaths(rows);
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" aria-hidden="true">'+svgCache[key]+'</svg>';
}
function glyph(name){
  const rows = GLYPHS[name], w = rows[0].length, h = rows.length;
  const d = pixPaths(rows.map(r => r.replace(/K/g, 'K')));
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges" style="width:'+(w / 16)+'rem;height:'+(h / 16)+'rem" aria-hidden="true">'+d+'</svg>';
}
const ico = (name, px) => h('span', { class:'ic', html: svg(name, px || 16) });

function buildApps(){
  const kids = {};
  CONFIG.apps.forEach(a => {
    kids[a.name] = { type:'folder', icon:a.icon, children:{
      ['Launch '+a.name+'.exe']: { type:'app', url:a.url, icon:a.icon || 'app', label:a.name },
      'README.txt': { type:'text', content: a.name+'\n'+'='.repeat(a.name.length)+'\n\n'+(a.description || '')+'\n\nOpen Launch '+a.name+'.exe to start it in a new tab.\nAddress: '+a.url }
    }};
  });
  return kids;
}
function buildDocs(){
  const d = {};
  CONFIG.documents.forEach(f => { d[f.name] = { type:'text', content:f.content }; });
  if (CONFIG.resumePdfUrl) d['Resume.pdf'] = { type:'pdf', url:CONFIG.resumePdfUrl, file:CONFIG.resumeFileName || 'Resume.pdf', icon:'pdf' };
  CONFIG.links.forEach(l => { d[l.name+'.url'] = { type:'link', url:l.url, icon:'globe' }; });
  return d;
}

  w.root.style.zIndex = ++z; activeWin = w; refresh();
}
function focusTop(){
  const vis = [...wins].filter(w => !w.min).sort((a,b) => Number(b.root.style.zIndex) - Number(a.root.style.zIndex))[0];
  if (vis) focusWin(vis); else { activeWin = null; refresh(); }
}

  w.max = !w.max; w.root.classList.toggle('max', w.max);
  if (w.maxBtn){ w.maxBtn.innerHTML = glyph(w.max ? 'restore' : 'max'); w.maxBtn.title = w.max ? 'Restore' : 'Maximize'; }
}
function closeWin(w){
  if (w.opts.onClose) w.opts.onClose();
  w.root.remove(); if (w.btn) w.btn.remove(); wins.delete(w);
  if (w.opts.key) keyed.delete(w.opts.key);
  if (activeWin === w){ activeWin = null; focusTop(); } else refresh();

function drag(handle, e, onMove){
  const sx = e.clientX, sy = e.clientY;
  handle.setPointerCapture(e.pointerId);
  const mv = ev => onMove(ev.clientX - sx, ev.clientY - sy);
  const up = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up); };
  handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
}
function createWindow(o){
  if (o.key && keyed.has(o.key)){ const ex = keyed.get(o.key); focusWin(ex); return ex; }
  const resizable = o.resizable !== false, minimizable = o.minimizable !== false;
  const maximizable = o.maximizable !== undefined ? o.maximizable : resizable;
  const dw = innerWidth, dh = innerHeight - TB();
  const w = { min:false, max:false, opts:o };
  const root = h('div', { class:'win', style:'width:'+Math.min((o.w || 420) * S, dw - 4)+'px;'+(o.h ? 'height:'+Math.min(o.h * S, dh - 4)+'px;' : '') });
  const titleEl = h('span', { class:'t' }, o.title);
  const tb = h('div', { class:'titlebar' }, o.icon === null ? null : ico(o.icon || 'app', 16), titleEl);
  const mk = (g, title, fn) => h('button', { class:'tbtn', title, 'aria-label':title, html:glyph(g), on:{ click: e => { e.stopPropagation(); fn(); } } });
  if (minimizable) tb.append(mk('min', 'Minimize', () => minWin(w)));
  if (maximizable){ w.maxBtn = mk('max', 'Maximize', () => toggleMax(w)); tb.append(w.maxBtn); }
  tb.append(mk('close', 'Close', () => closeWin(w)));
  const body = h('div', { class:'body' }, o.content);
  root.append(tb); if (o.menu) root.append(o.menu); root.append(body);
  if (resizable){
    const g = h('div', { class:'grip' });
    g.addEventListener('pointerdown', e => {
      e.stopPropagation(); focusWin(w);
      const ow = root.offsetWidth, oh = root.offsetHeight;
      drag(g, e, (dx, dy) => { root.style.width = Math.max(240 * S, ow + dx)+'px'; root.style.height = Math.max(140 * S, oh + dy)+'px'; });
    });
    root.append(g);
  }
  root.addEventListener('pointerdown', () => focusWin(w), true);
  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('.tbtn') || w.max) return;
    const ox = root.offsetLeft, oy = root.offsetTop;
    drag(tb, e, (dx, dy) => {
      root.style.left = Math.max(60 * S - root.offsetWidth, Math.min(innerWidth - 60 * S, ox + dx))+'px';
      root.style.top = Math.max(0, Math.min(dh - 20 * S, oy + dy))+'px';
    });

  const baseX = (dw >= 900 ? 120 : 24) * S;
  let x = baseX + (cascade % 8) * 26 * S, y = (16 + (cascade % 8) * 26) * S; cascade++;
  if (o.center){ x = (dw - root.offsetWidth) / 2; y = (dh - root.offsetHeight) / 2.4; }
  if (x + root.offsetWidth > dw) x = Math.max(0, dw - root.offsetWidth);
  if (y + 40 * S > dh) y = 0;
  root.style.left = Math.max(0, x)+'px'; root.style.top = Math.max(0, y)+'px';
  w.root = root; w.titleEl = titleEl;
  w.setTitle = t => { titleEl.textContent = t; if (w.btnLabel) w.btnLabel.textContent = t; };

    w.btnLabel = h('span', { class:'tl' }, o.title);

    tasks.append(w.btn);

  wins.add(w); if (o.key) keyed.set(o.key, w);

}

function openUrl(url, name){

}

function openNode(node, name, ctx){
  switch (node.type){
    case 'folder': openExplorer(ctx.tree, [...ctx.path, name]); break;
    case 'text': openNotepad(name, node.content); break;
    case 'pdf': openPdf(name, node); break;
    case 'link': case 'app': openUrl(node.url, node.label || name); break;
    case 'program': programs[node.run](); break;
    case 'dialog': msgBox({ title:name, text:node.msg, icon:'warn' }); break;

}

  const LANG = { JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572a5', HTML:'#e34c26', CSS:'#563d7c', Shell:'#89e051', Swift:'#f05138', Go:'#00add8', Rust:'#dea584', C:'#555555', 'C++':'#f34b7d', Java:'#b07219' };

    if (rev.filter(Boolean).length === W * H - M){

    }

  });

  grid.addEventListener('contextmenu', e => { e.preventDefault(); const c = e.target.closest('.cell'); if (c) toggleFlag(+c.dataset.i); });

    { label:'Help', items:[ { label:'How to play', run: () => msgBox({ title:'Minesweeper', icon:'info', text:'Click to reveal a square.\nRight-click (or long-press on touch) to flag a mine.\nNumbers show how many mines touch a square.' }) } ] }
  ]);

function fitSub(li){
  const ul = li.querySelector(':scope>.sm'); if (!ul || innerWidth <= 640) return;
  ul.style.top = ''; ul.style.maxHeight = ''; ul.style.overflowY = ''; ul.classList.remove('left');
  let r = ul.getBoundingClientRect();
  if (r.right > innerWidth){ ul.classList.add('left'); r = ul.getBoundingClientRect(); }
  const limit = innerHeight - TB() - 2, base = parseFloat(getComputedStyle(ul).top);
  if (r.bottom > limit) ul.style.top = (base - (r.bottom - limit)) + 'px';
  r = ul.getBoundingClientRect();
  if (r.top < 2){
    ul.style.top = (base - r.top + 2 + (parseFloat(ul.style.top || base) - base)) + 'px';
    r = ul.getBoundingClientRect();
    if (r.bottom > limit && !ul.querySelector('li.arrow')){ ul.style.maxHeight = Math.max(80, limit - r.top) + 'px'; ul.style.overflowY = 'auto'; }
  }
}
function applySub(ul, want){
  ul._want = want; clearTimeout(ul._t);
  [...ul.children].forEach(l => l.classList.toggle('open', l === want && !!l.querySelector(':scope>.sm')));
  if (want) fitSub(want);
}
function hoverSub(ul, want, delay){
  if (ul._want === want) { clearTimeout(ul._t); return; }
  clearTimeout(ul._t);
  const anyOpen = [...ul.children].some(l => l.classList.contains('open'));
  const d = delay != null ? delay : (anyOpen ? 350 : 120);
  ul._pend = want;
  ul._t = setTimeout(() => applySub(ul, want), d);
}

    const ul = li.parentElement;
    if (li === deepest) hoverSub(ul, li.querySelector(':scope>.sm') ? li : null);
    else { clearTimeout(ul._t); if (ul._want !== li) applySub(ul, li); }
    li = ul.parentElement && ul.parentElement.closest('li');
  }
});

  face.addEventListener('click', () => { if (panel) closePanel(); else go('menu'); });
  face.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); face.click(); } });
  el._go = go; el._panel = () => panel; el._cos = setCostume;
  window.__dsync = () => setCostume(diskyCostumeFor(activeWin));
  setInterval(() => { if (cos === 'default' && el.isConnected && !el.classList.contains('hide')){ draw('c_default_blink'); setTimeout(() => { if (cos === 'default') draw(); }, 140); } }, 3600);
  document.body.append(el);
  setCostume(diskyCostumeFor(activeWin));
  if (cos === 'default'){ draw('c_default_wave'); setTimeout(() => { if (cos === 'default') draw(); }, 1800); }
  return el;
}
function showDisky(start){
  const el = ensureDisky(); el._go(start || 'menu');
}

/* =====================================================================
   easter eggs: konami code, cheat words, blue screen, screen saver
   ===================================================================== */
const KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
let buf = [];
document.addEventListener('keydown', e => {
  if (e.key.length > 1 && e.key.indexOf('Arrow') !== 0) return;
  const typing = /^(input|textarea)$/i.test(e.target.tagName);
  buf.push(e.key.toLowerCase()); buf = buf.slice(-10);
  if (buf.join() === KONAMI.join()){ buf = []; showBsod(); return; }
  if (!typing){
    const s = buf.filter(k => k.length === 1).join('');
    if (/idkfa$/.test(s)){ buf = []; msgBox({ title:'DOOM', icon:'info', text:'Cheat activated: full health, all keys, and an alarming number of browser tabs.' }); }
    else if (/xyzzy$/.test(s)){ buf = []; msgBox({ title:CONFIG.siteName, icon:'info', text:'Nothing happens.' }); }
  }
});
function showBsod(){
  if ($('#bsod')) return;
  const b = h('div', { id:'bsod' }, h('div', { style:'text-align:center;margin-bottom:1.5rem' }, h('b', { text:' ZachOS 95 ' })),
`A fatal exception 0E has occurred at 0028:C0011E36 in VXD VMM(01) + 00010E36. The current application will be terminated.

Cause: Konami code detected. Honestly, this one is not your fault.

*  Press any key to terminate the current application.
*  Press CTRL+ALT+DEL again to restart your computer. You will lose any unsaved information in all applications.

                       Press any key to continue _`);
  document.body.append(b);
  const kill = () => { b.remove(); document.removeEventListener('keydown', kill, true); };
  setTimeout(() => { document.addEventListener('keydown', kill, true); b.addEventListener('pointerdown', kill); }, 400);
}
let idleT, saverOn = false;
function resetIdle(){ clearTimeout(idleT); if (!saverOn) idleT = setTimeout(startSaver, 120000); }
function startSaver(){
  if (saverOn) return; saverOn = true; closeStart(); closeCtx();
  const c = h('canvas', { id:'saver' }); document.body.append(c);
  c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d');
  const stars = Array.from({ length:220 }, () => ({ x:(Math.random() - .5) * 2, y:(Math.random() - .5) * 2, z:Math.random() }));
  let raf;
  const frame = () => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#fff';
    for (const s of stars){
      s.z -= 0.006;
      if (s.z <= 0.02){ s.x = (Math.random() - .5) * 2; s.y = (Math.random() - .5) * 2; s.z = 1; }
      const px = c.width / 2 + s.x / s.z * c.width / 4, py = c.height / 2 + s.y / s.z * c.height / 4, r = Math.max(1, (1 - s.z) * 3);
      ctx.fillRect(px, py, r, r);
    }
    raf = requestAnimationFrame(frame);
  };
  frame();
  let armed = false; setTimeout(() => { armed = true; }, 500);
  const stop = () => { cancelAnimationFrame(raf); c.remove(); saverOn = false; window.removeEventListener('keydown', stop, true); window.removeEventListener('pointerdown', stop, true); window.removeEventListener('pointermove', mv, true); resetIdle(); };
  const mv = () => { if (armed) stop(); };
  window.addEventListener('keydown', stop, true); window.addEventListener('pointerdown', stop, true); window.addEventListener('pointermove', mv, true);
}
['pointermove', 'pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle, true));
resetIdle();

/* =====================================================================
   boot sequence
   ===================================================================== */
function boot(){
  const b = $('#boot');
  let seen = false; try { seen = !!sessionStorage.getItem('zoat_booted'); } catch (e) {}
  if (seen || /noboot/.test(location.search)){ b.remove(); return Promise.resolve(); }
  return new Promise(resolve => {
    b.style.display = 'block';
    const lines = [
      'ZachOS BIOS v1.0, An Over-Caffeinated Production',
      'Copyright (C) 1986-2026 Zach of All Trades, Inc.', '',
      'CPU: Pentium-ish 100 MHz',
      'Memory Test: 640K OK',
      'Detecting Primary Master ... Hard Drive of Many Hats',
      'Detecting Secondary Master ... CD-ROM', '',
      'Press any key to skip...', '',
      'Starting ZachOS 95...'
    ];
    let done = false; const timers = [];
    const finish = () => {
      if (done) return; done = true; timers.forEach(clearTimeout);
      try { sessionStorage.setItem('zoat_booted', '1'); } catch (e) {}
      document.removeEventListener('keydown', finish); b.remove(); resolve();
    };
    lines.forEach((l, i) => timers.push(setTimeout(() => { b.append(l + '\n'); }, 160 + i * 130)));
    timers.push(setTimeout(() => {
      b.textContent = '';
      b.append(h('div', { class:'splash' }, h('h1', { text:'ZachOS 95' }), h('p', { text:'Starting up...' }), h('div', { class:'pbar' }, h('i'))));
    }, 160 + lines.length * 130 + 300));
    timers.push(setTimeout(finish, 160 + lines.length * 130 + 2300));
    b.addEventListener('pointerdown', finish); document.addEventListener('keydown', finish);
  });
}
boot().then(() => {
  let hide = false; try { hide = !!localStorage.getItem('zoat_notips'); } catch (e) {}
  let nod = false, toured = false; try { nod = !!localStorage.getItem('zoat_nodisky'); toured = !!localStorage.getItem('zoat_toured'); } catch (e) {}
  if (!hide && (toured || nod)) setTimeout(openTips, 350);
  let dh = false; try { dh = !!localStorage.getItem('zoat_dhide'); } catch (e) {}
  if (!dh) setTimeout(ensureDisky, 1500);
  if (nod) return;
  if (!toured && !dh) setTimeout(() => showDisky('intro'), 4000);
  const offerLinkedIn = () => {
    try { if (sessionStorage.getItem('zoat_li')) return; } catch (e) {}
    if (!diskyEl || diskyEl.classList.contains('hide')) return;
    if (diskyEl._panel()) return setTimeout(offerLinkedIn, 8000);
    try { sessionStorage.setItem('zoat_li', '1'); } catch (e) {}
    showDisky('ask');
  };
  setTimeout(offerLinkedIn, 60000);
});
})();
